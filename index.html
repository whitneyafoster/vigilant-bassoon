<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Your Aesthetic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <p class="eyebrow">Allyn's Closet presents</p>
      <h1>What’s your<br /><em>fashion mood</em> today?</h1>
      <p class="intro">Click the button for an unexpected aesthetic and a little styling direction.</p>

      <section class="result-card" aria-live="polite">
        <p class="card-label">Your aesthetic</p>
        <h2 id="aesthetic-name">Ready when you are</h2>
        <p id="aesthetic-description">Your next look is one click away.</p>
        <div id="color-swatches" class="swatches" aria-label="Color palette"></div>
        <p id="outfit-formula" class="outfit-formula"></p>
      </section>

      <button id="find-look-button" type="button">Find my look</button>
      <p class="lesson-note">Lesson 1: a button event, a function, and changing text on the page.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
